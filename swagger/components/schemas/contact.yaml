type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name.  Should be between 3 and 20"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number.  Should be between 3 and 20"
    type: string
    example: +380990000001
  email:
    description: "Contact's email.  Should be between 3 and 20"
    type: string
    example: test@example.com
  contactType:
    description: "Contact's type."
    type: string
    enum: ['work', 'home', 'personal']
  isFavourite:
    description: 'Is contact favourite or not'
    type: boolean
    example: false
  userId:
    description: "Contact's user id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
